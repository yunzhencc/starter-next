minimumReleaseAgeExclude:
  - lucide-react@1.35.0
  - simple-git-hooks@2.14.0
  - '@types/node@26.4.1'
shellEmulator: true

trustPolicy: no-downgrade

allowBuilds:
  node-pty: false
  simple-git-hooks: true
  unrs-resolver: true

trustPolicyExclude:
  - semver@6.3.1
  - fastq@1.20.2

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
ignoredOptionalDependencies:
  - '@eslint-react/eslint-plugin'
